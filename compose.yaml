name: solo88-thermosurvey
services:
  desk:
    build:
      context: .
      args:
        THERMOSURVEY_RUNTIME_IMAGE: ${THERMOSURVEY_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${THERMOSURVEY_IMAGE:-solo88-thermosurvey:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${THERMOSURVEY_PORT:-19888}:8000"
    volumes:
      - thermal-data:/var/lib/thermosurvey
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/thermal/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  thermal-data:
